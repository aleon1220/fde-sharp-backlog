apiVersion: v1
kind: Pod
metadata:
  name: smart-backlog-assistant
  labels:
    app: smart-backlog-assistant
    use-case: as-is-v1
spec:
  restartPolicy: Never
  containers:
    - name: assistant
      image: localhost/smart-backlog-assistant:v1
      args:
        - "--input"
        - "samples/raw-notes.txt"
        - "--prompt"
        - "prompts/as-is-v1-prompt.md"
        - "--provider"
        - "manual"
        - "--type"
        - "Type01"
        - "--output-dir"
        - "/app/output"
        - "--non-interactive"
      env:
        - name: AI_API_KEY
          value: ""
